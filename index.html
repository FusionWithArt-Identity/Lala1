<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      background-color: black;
      overflow-x: hidden;
    }

    .card-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 40px;
    }

    .card {
      width: 200px;
      height: 300px;
      background-color: #111;
      border-radius: 10px;
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.6s;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: absolute;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card:hover .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      border-radius: 10px;
    }

    .card-front {
      background-color: #222;
    }

    .card-back {
      background-color: #333;
      transform: rotateY(180deg);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">Card 1</div>
        <div class="card-back">Back 1</div>
      </div>
    </div>
    <div class="card">
      <div class="card-inner">
        <div class="card-front">Card 2</div>
        <div class="card-back">Back 2</div>
      </div>
    </div>
    <div class="card">
      <div class="card-inner">
        <div class="card-front">Card 3</div>
        <div class="card-back">Back 3</div>
      </div>
    </div>
  </div>

  <canvas id="glowCanvas"></canvas>

  <script>
    const canvas = document.getElementById("glowCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class CardGlow {
      constructor(card, color = "#0ff", speed = 0.4) {
        this.card = card;
        this.color = color;
        this.speed = speed;

        this.updatePosition();
        this.path = this.generatePath();
        this.progress = 0;
        this.trail = [];
        this.maxTrailLength = 20;
      }

      updatePosition() {
        const rect = this.card.getBoundingClientRect();
        this.x = rect.left + window.scrollX;
        this.y = rect.top + window.scrollY;
        this.width = rect.width;
        this.height = rect.height;
      }

      generatePath() {
        const points = [];
        const steps = 100;

        const addSegment = (x1, y1, x2, y2) => {
          const vertical = x1 === x2;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const easeT = 0.5 * (1 - Math.cos(Math.PI * t));
            points.push({
              x: x1 + (x2 - x1) * easeT,
              y: y1 + (y2 - y1) * easeT
            });
          }
        };

        addSegment(this.x, this.y, this.x + this.width, this.y); // top
        addSegment(this.x + this.width, this.y, this.x + this.width, this.y + this.height); // right
        addSegment(this.x + this.width, this.y + this.height, this.x, this.y + this.height); // bottom
        addSegment(this.x, this.y + this.height, this.x, this.y); // left

        return points;
      }

      update(delta) {
        this.updatePosition();
        this.progress += this.speed * (delta / 16.67);
        if (this.progress >= this.path.length) this.progress = 0;

        const index = Math.floor(this.progress);
        this.trail.unshift(index);
        if (this.trail.length > this.maxTrailLength) {
          this.trail.pop();
        }
      }

      draw(ctx) {
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;

        for (let i = 0; i < this.trail.length; i++) {
          const idx = this.trail[i];
          const point = this.path[idx % this.path.length];
          const alpha = (1 - i / this.trail.length) * 0.6;

          ctx.beginPath();
          ctx.arc(point.x, point.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.hexToRGB(this.color)},${alpha})`;
          ctx.fill();
        }
      }

      hexToRGB(hex) {
        const value = parseInt(hex.replace("#", ""), 16);
        return `${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}`;
      }
    }

    const cards = document.querySelectorAll(".card");
    const glows = [
      new CardGlow(cards[0], "#0ff", 0.4),
      new CardGlow(cards[1], "#f00", 0.4),
      new CardGlow(cards[2], "#0f0", 0.4)
    ];

    let lastTimestamp = performance.now();
    function animate(timestamp) {
      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      glows.forEach((glow) => {
        glow.update(delta);
        glow.draw(ctx);
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
