<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimized Flip Cards with Glow</title>
<style>
  .flip-card.lifted { transform: translateY(-10px); }
  .flip-card.active { z-index: 20; }
  .aspect-item.visible, .aspect-content.visible { opacity: 1; transition: opacity 0.3s; }
</style>
</head>
<body>
<!-- Flip card HTML elements with IDs like clown-card, joker-card, jester-card should be here -->

<script>
(() => {
    let currentActiveCard = null;
    let isAnimating = false;

    async function toggleCard(card) {
        if (isAnimating) return;
        isAnimating = true;

        if (currentActiveCard === card) {
            card.classList.remove('lifted');
            await new Promise(res => setTimeout(res, 300));
            card.classList.remove('active');
            currentActiveCard = null;
            resetCardContent(card);
        } else {
            if (currentActiveCard) {
                currentActiveCard.classList.remove('lifted');
                await new Promise(res => setTimeout(res, 300));
                currentActiveCard.classList.remove('active');
                resetCardContent(currentActiveCard);
            }
            card.classList.add('lifted');
            await new Promise(res => setTimeout(res, 500));
            card.classList.add('active');
            currentActiveCard = card;
            animateCardContent(card);
        }
        isAnimating = false;
    }

    function animateCardContent(card) {
        const items = card.querySelectorAll('.aspect-item');
        const contents = card.querySelectorAll('.aspect-content');
        items.forEach(item => item.classList.remove('visible'));
        contents.forEach(c => c.classList.remove('visible'));
        items.forEach((item, i) => {
            setTimeout(() => {
                item.classList.add('visible');
                setTimeout(() => {
                    const content = item.querySelector('.aspect-content');
                    if (content) content.classList.add('visible');
                }, 300);
            }, i * 600);
        });
    }

    function resetCardContent(card) {
        card.querySelectorAll('.aspect-item, .aspect-content').forEach(el => el.classList.remove('visible'));
    }

    document.body.addEventListener('click', e => {
        if (currentActiveCard && !currentActiveCard.contains(e.target) && !isAnimating) {
            isAnimating = true;
            currentActiveCard.classList.remove('lifted');
            setTimeout(() => {
                currentActiveCard.classList.remove('active');
                resetCardContent(currentActiveCard);
                currentActiveCard = null;
                isAnimating = false;
            }, 300);
        } else if (e.target.closest('.flip-card')) {
            toggleCard(e.target.closest('.flip-card'));
        }
    });

    const glowConfig = {
        'clown-card':  { color: '#00a8ff', width: 6, blur: 35, speed: 0.40 },
        'joker-card':  { color: '#ff3333', width: 6, blur: 35, speed: 0.40 },
        'jester-card': { color: '#00cc66', width: 6, blur: 35, speed: 0.40 }
    };

    const glowContainer = document.createElement('div');
    Object.assign(glowContainer.style, {
        position: 'fixed', top: 0, left: 0, width: '100%', height: '100%',
        pointerEvents: 'none', zIndex: 10
    });
    document.body.appendChild(glowContainer);

    const canvasContexts = new Map();
    for (const id in glowConfig) {
        const canvas = document.createElement('canvas');
        canvas.className = `glow-canvas ${id}-glow`;
        canvas.dataset.cardId = id;
        Object.assign(canvas.style, {
            position: 'absolute', pointerEvents: 'none', zIndex: 1, borderRadius: '12px'
        });
        glowContainer.appendChild(canvas);
        canvasContexts.set(canvas, { ctx: canvas.getContext('2d'), progress: 0 });
    }

    function updateGlowPositions() {
        document.querySelectorAll('.flip-card').forEach(card => {
            const canvas = document.querySelector(`.${card.id}-glow`);
            if (!canvas) return;
            const { blur, width } = glowConfig[card.id];
            const padding = blur + width;
            const rect = card.getBoundingClientRect();
            Object.assign(canvas.style, {
                top: `${rect.top - padding}px`,
                left: `${rect.left - padding}px`,
                width: `${rect.width + padding * 2}px`,
                height: `${rect.height + padding * 2}px`
            });
        });
    }

    function pointAtLength(len, w, h) {
        const perimeter = 2 * (w + h);
        len = (len + perimeter) % perimeter;
        if (len < w) return { x: len, y: 0 };
        if (len < w + h) return { x: w, y: len - w };
        if (len < 2 * w + h) return { x: 2 * w + h - len, y: h };
        return { x: 0, y: perimeter - len };
    }

    function buildUniformGlowPath(w, h, startT, endT, segments = 500) {
        const path = new Path2D();
        const perimeter = 2 * (w + h);
        const start = startT * perimeter, end = endT * perimeter;
        const totalLen = (end >= start) ? end - start : perimeter - start + end;
        const step = totalLen / segments;
        let prev = pointAtLength(start, w, h);
        path.moveTo(prev.x, prev.y);
        for (let i = 1; i <= segments; i++) {
            const len = (start + step * i) % perimeter;
            const pt = pointAtLength(len, w, h);
            path.lineTo(pt.x, pt.y);
        }
        return path;
    }

    function drawGlow(ctx, color, progress, length, width, blur, w, h) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        const perimeter = 2 * (w + h);
        const center = progress * perimeter;
        const halfLen = (length * perimeter) / 2;
        const start = (center - halfLen + perimeter) % perimeter;
        const end = (center + halfLen) % perimeter;

        ctx.save();
        const offset = blur + width;
        ctx.translate(offset + 0.5, offset + 0.5);
        ctx.lineWidth = width;
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const path = buildUniformGlowPath(w, h, start / perimeter, end / perimeter);
        ctx.stroke(path);
        ctx.restore();
    }

    let lastTime = performance.now();
    function animate(time) {
        const delta = Math.min(time - lastTime, 33);
        lastTime = time;

        updateGlowPositions();
        canvasContexts.forEach((data, canvas) => {
            const { cardId } = canvas.dataset;
            const config = glowConfig[cardId];
            const card = document.getElementById(cardId);
            if (!card || card.classList.contains('active')) {
                data.ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            const dpr = window.devicePixelRatio || 1;
            const sw = parseInt(canvas.style.width);
            const sh = parseInt(canvas.style.height);
            if (canvas.width !== sw * dpr || canvas.height !== sh * dpr) {
                canvas.width = sw * dpr;
                canvas.height = sh * dpr;
                data.ctx.setTransform(1, 0, 0, 1, 0, 0);
                data.ctx.scale(dpr, dpr);
            } else {
                data.ctx.setTransform(1, 0, 0, 1, 0, 0);
                data.ctx.scale(dpr, dpr);
            }
            data.progress = (data.progress + config.speed * delta / 1000) % 1;
            drawGlow(
                data.ctx, config.color, data.progress, 0.3,
                config.width, config.blur,
                sw - (config.blur + config.width) * 2,
                sh - (config.blur + config.width) * 2
            );
        });
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    window.addEventListener('resize', () => setTimeout(updateGlowPositions, 100));
})();
</script>
</body>
</html>
