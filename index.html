<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clown vs Joker vs Jester</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: 'Courier New', monospace;
        background-color: black;
        color: #333;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        touch-action: manipulation;
        overflow-x: hidden;
        padding: 15px;
    }
    h1 {
        color: #5e35b1;
        margin-bottom: 20px;
        font-size: 1.8rem;
        text-align: center;
        font-weight: bold;
    }
    .cards-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 25px;
        width: 100%;
        height: 60%;
    }
    .flip-card {
        background-color: transparent;
        width: 30%;
        height: 200px;
        perspective: 1000px;
        transition: all 1s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
    }
    .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        transform-style: preserve-3d;
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        border-radius: 12px;
    }
    .flip-card.lifted {
        transform: translateY(-30px) scale(1.05);
    }
    .flip-card.active {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 90vh;
        z-index: 100;
        padding: 25px;
        transform: none !important;
        overflow-y: auto;
    }
    .flip-card.active ~ .flip-card,
    .flip-card.active ~ h1 {
        display: none;
    }
    .flip-card.active .flip-card-inner {
        width: 100%;
        height: 100%;
        transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .flip-card-front {
        background-color: #fff;
    }
    .flip-card-back {
        background-color: #fff;
        transform: rotateY(180deg);
        overflow-y: auto;
        padding: 25px;
    }
    #clown-card.active .flip-card-back {
        background: #0a1a2a !important;
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.7), inset 0 0 15px rgba(0, 200, 255, 0.4);
        border: 2px solid #00a8ff !important;
    }
    #joker-card.active .flip-card-back {
        background: #2a0a0a !important;
        box-shadow: 0 0 30px rgba(255, 50, 50, 0.7), inset 0 0 15px rgba(255, 100, 100, 0.4);
        border: 2px solid #ff3333 !important;
    }
    #jester-card.active .flip-card-back {
        background: #0a2a0a !important;
        box-shadow: 0 0 30px rgba(50, 255, 50, 0.7), inset 0 0 15px rgba(100, 255, 100, 0.4);
        border: 2px solid #00cc66 !important;
    }
    .image-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .character-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }
    .character-title {
        color: #5e35b1;
        font-weight: bold;
        margin-bottom: 25px;
        font-size: 2rem;
        text-align: center;
    }
    .flip-card.active .flip-card-back .character-title,
    .flip-card.active .flip-card-back .aspect-title,
    .flip-card.active .flip-card-back .aspect-content {
        color: #ffffff !important;
    }
    .aspect-item {
        margin-bottom: 25px;
        text-align: left;
        width: 100%;
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.6s ease;
    }
    .aspect-item.visible {
        opacity: 1;
        transform: translateX(0);
    }
    .aspect-title {
        font-weight: bold;
        color: #5e35b1;
        font-size: 1.5rem;
        margin-bottom: 10px;
    }
    .aspect-content {
        font-size: 1.4rem;
        line-height: 1.6;
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.6s ease;
        color: #222;
        font-weight: 500;
    }
    .aspect-content.visible {
        opacity: 1;
        transform: translateX(0);
    }
    @media (max-width: 500px) {
        h1 { font-size: 1.8rem; margin-bottom: 15px; }
        .flip-card { height: 180px; }
        .character-title { font-size: 1.8rem; margin-bottom: 20px; }
        .aspect-title { font-size: 1.4rem; }
        .aspect-content { font-size: 1.3rem; }
        .flip-card-back { padding: 20px; }
    }
    @media (max-width: 400px) {
        .cards-container { gap: 10px; }
        .flip-card { height: 160px; }
        .character-title { font-size: 1.6rem; }
        .aspect-title { font-size: 1.3rem; }
        .aspect-content { font-size: 1.2rem; }
    }

    /* Fallback Glow Animation for Low-End Devices */
    .flip-card:not(.active)::before {
        content: '';
        position: absolute;
        top: -6px; left: -6px; right: -6px; bottom: -6px;
        border-radius: 16px;
        pointer-events: none;
        z-index: 1;
        animation: neon-rotate 3s linear infinite;
        background: conic-gradient(from 0deg, var(--glow-color) 0%, transparent 100%);
        filter: blur(8px);
    }
    #clown-card:not(.active)::before {
        --glow-color: #00a8ff;
    }
    #joker-card:not(.active)::before {
        --glow-color: #ff3333;
    }
    #jester-card:not(.active)::before {
        --glow-color: #00cc66;
    }
    @keyframes neon-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    </style>
</head>
<body>
    <h1>Clown Vs Joker Vs Jester</h1>

    <script>
    let glowEffectsAllowed = true;
    if (navigator.hardwareConcurrency <= 4 || navigator.deviceMemory <= 2) {
        glowEffectsAllowed = false;
    }
    setTimeout(() => {
        let frameCount = 0;
        let start = performance.now();
        function measureFPS(now) {
            frameCount++;
            if (now - start < 1000) {
                requestAnimationFrame(measureFPS);
            } else {
                if (frameCount < 40) glowEffectsAllowed = false;
            }
        }
        requestAnimationFrame(measureFPS);
    }, 100);
    </script>

    <!-- Include your existing JavaScript logic for toggleCard, animations, etc. -->
    <!-- Then include conditional canvas glow -->

    if (document.readyState === 'complete') {
        if (glowEffectsAllowed) createNonIntrusiveGlowEffect();
    } else {
        document.addEventListener('DOMContentLoaded', () => {
            if (glowEffectsAllowed) createNonIntrusiveGlowEffect();
        });
    }
    </script>
</body>
</html>
